# Lint and tests. No secrets, no builds and no agent calls: the fake
# backend and fake sbuild/lxc stand in for them.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The dev/verify tests build a real source package with them.
      - name: Packaging tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            dpkg-dev devscripts quilt ubuntu-dev-tools
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q -rs
