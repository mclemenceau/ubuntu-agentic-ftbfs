# ftbfs review pipeline configuration: project defaults.
#
# Site settings (build hosts, key files, concurrency, the changelog
# identity) go in config.local.toml, which is git-ignored and merged
# over this file: tables merge key by key, other values replace. Start
# from config.local.toml.example.

source_url = "http://qa.ubuntuwire.com/ftbfs/"

[paths]
state = "state"      # SQLite DB + snapshot JSON
cache = "cache"      # downloaded build logs, source trees
work = "work"        # per-item artifacts, investigation.md
plugins = "plugins"  # local stage plugins (*.py)
pipeline = "pipeline.toml"

# Default selection. CLI flags override; --profile applies a named set.
# States accept codes: F (FAILEDTOBUILD), M (MANUALDEPWAIT),
# X (CANCELLED), U (UPLOADFAIL), C (CHROOTWAIT).
[filter]
components = ["universe"]
states = ["F"]
arches = []          # empty = all
pockets = []         # release, proposed; empty = both
skip_lp_bug = true   # skip packages ubuntuwire lists an LP bug for

[filter.profiles.main]
components = ["main", "restricted"]

[filter.profiles.amd64]
arches = ["amd64"]

[filter.profiles.everything]
components = []
states = []
skip_lp_bug = false

# Max concurrent units per stage kind. Builds are bounded by the
# builders' slots (config.local.toml, `[builders.*]`); `build` only
# applies when no builder is configured (plain local sbuild).
[concurrency]
deterministic = 8
agent = 4
build = 2
outward = 1

[agents]
default_backend = "opencode"

# Stages ask for a tier; each backend maps tiers to its own models.
[backend.claude.tiers]
small = "haiku"
medium = "sonnet"
large = "opus"

# opencode: provider/model ids. Pinned versions keep runs reproducible.
# The key files (`api_keys`) are a site setting: config.local.toml.
[backend.opencode.tiers]
small = "openrouter/anthropic/claude-haiku-4.5"
medium = "openrouter/anthropic/claude-sonnet-5"
large = "openrouter/anthropic/claude-opus-5.5"

# Host names the web UI answers to (the Host header, without the port);
# any other gets 403, which also stops DNS rebinding. Loopback only by
# default. Without a login (`[web.auth]`, see config.local.toml.example)
# the UI refuses any other name and any bind beyond loopback: whoever
# reaches it can do anything. With one, list the public name in
# config.local.toml (the list replaces this one).
[web]
allowed_hosts = ["127.0.0.1", "localhost", "::1"]
# USD of LLM cost that runs started from the web UI may record per UTC
# day; past it, the UI starts no more runs (the CLI still can).
daily_cost_cap = 10.0
# Live streams (events, agent consoles) open at once, over all viewers.
max_streams = 64
