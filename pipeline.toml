# The pipeline DAG. Each [stage.<name>] must be a registered stage
# (`ftbfs stages` lists them). Keys:
#   after   = [...]      dependencies that must be ok
#   when    = "expr"     predicate over upstream results, e.g.
#                        "triage.fixable != 'no' and item.arch == 'amd64'"
#   gate    = "manual"   wait for approval (forced for outward stages)
#   enabled = false      keep the block but skip the stage
#   agent   = { backend = "claude", tier = "medium", max_turns = 30,
#               escalate_after_loops = 1, escalate_tier = "large" }
#   on_fail = { goto = "<upstream stage>", max_loops = 2 }
#   any other key is passed to the stage as an option.
#
# Stages are enabled here milestone by milestone as they are implemented.
# Target default pipeline:
#
#   excerpt -> classify (+cluster) -> facts -> triage -> diagnose
#     -> confirm -> [gate] reproduce -> dev -> verify
#     -> adversarial_review (on_fail: dev) -> [gate] lp_file_bug

[stage.excerpt]

[stage.classify]
after = ["excerpt"]

# Package-level Debian/upstream facts; independent of the log stages.
[stage.facts]

# First verdict per cluster; facts-decidable clusters skip the LLM.
[stage.triage]
after = ["classify", "facts"]
agent = { tier = "small", max_budget_usd = 0.5 }

# Root cause + fix strategy, once per cluster worth fixing in Ubuntu.
[stage.diagnose]
after = ["triage"]
when = "triage.fixable != 'no' and triage.action in ['patch', 'investigate', 'report-upstream', 'restrict-arch']"
agent = { tier = "medium", effort = "medium", max_budget_usd = 1.0 }
