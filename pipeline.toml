# The pipeline DAG. Each [stage.<name>] must be a registered stage
# (`ftbfs stages` lists them). Keys:
#   after   = [...]      dependencies that must be ok
#   when    = "expr"     predicate over upstream results, e.g.
#                        "triage.fixable != 'no' and item.arch == 'amd64'"
#   gate    = "manual"   wait for approval (forced for outward stages)
#   enabled = false      keep the block but skip the stage
#   agent   = { backend = "claude", tier = "medium", max_turns = 30,
#               escalate_after_loops = 1, escalate_tier = "large" }
#   on_fail = { goto = "<upstream stage>", max_loops = 2 }
#   any other key is passed to the stage as an option.
#
# Options, agent specs and versions are part of each result's cache key:
# changing one re-runs that stage and everything after it. Planned
# stages are listed in docs/STATUS.md, "Roadmap".

[stage.excerpt]

[stage.classify]
after = ["excerpt"]

# Package-level Debian/upstream facts; independent of the log stages.
[stage.facts]

# First verdict per cluster; facts-decidable clusters skip the LLM.
[stage.triage]
after = ["classify", "facts"]
agent = { tier = "small", max_budget_usd = 0.5 }

# Root cause + fix strategy, once per cluster worth fixing in Ubuntu.
[stage.diagnose]
after = ["triage"]
when = "triage.fixable != 'no' and triage.action in ['patch', 'investigate', 'report-upstream', 'restrict-arch']"
agent = { tier = "medium", effort = "high", max_budget_usd = 1.0 }

# Rebuild the failing version and compare with Launchpad (0 tokens).
# Not gated: local sbuild is free and has no outside effect. Setting
# `ppa` uploads to Launchpad, so add `gate = "manual"` back with it.
[stage.reproduce]
after = ["excerpt", "triage"]
when = "triage.action in ['patch', 'investigate', 'report-upstream']"
local_arches = ["amd64"]
parallel = 8
# ppa = "<lp-user>/ftbfs-repro"   # enables other arches via Launchpad

# Agent fixes the source (Read/Grep/Edit only; no shell, no network);
# tooling turns edits into a DEP-3 patch, changelog and debdiff.
# Human-gated: `ftbfs approve dev <source|item>`.
[stage.dev]
after = ["reproduce", "diagnose"]
when = "reproduce.outcome in ['reproduced', 'reproduced-similar']"
gate = "manual"
agent = { tier = "medium", effort = "medium", max_budget_usd = 2.0, timeout = 1200, escalate_after_loops = 2, escalate_tier = "large" }
max_errors = 1

# Rebuild the patched package; failures loop back to dev with the new
# excerpt (at most twice, the last attempt on the large tier).
[stage.verify]
after = ["dev"]
local_arches = ["amd64"]
parallel = 8
on_fail = { goto = "dev", max_loops = 2 }
