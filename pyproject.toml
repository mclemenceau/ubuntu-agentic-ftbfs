[project]
name = "ftbfs"
version = "0.1.0"
description = "Agentic review pipeline for Ubuntu FTBFS"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Matthieu Clemenceau", email = "matthieu.clemenceau@canonical.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "launchpadlib>=2.1.0",
    "lxml>=5",
    "markdown-it-py>=4.2.0",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/mclemenceau/ubuntu-agentic-ftbfs"
Issues = "https://github.com/mclemenceau/ubuntu-agentic-ftbfs/issues"

[project.scripts]
ftbfs = "ftbfs.cli:main"

[project.entry-points."ftbfs.stages"]
# External plugins register here, e.g.:
# my_stage = "my_pkg.module:MyStage"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
