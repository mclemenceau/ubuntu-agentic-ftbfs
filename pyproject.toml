[project]
name = "ftbfs"
version = "0.1.0"
description = "Agentic review pipeline for Ubuntu FTBFS"
requires-python = ">=3.12"
dependencies = [
    "launchpadlib>=2.1.0",
    "lxml>=5",
    "psycopg[binary]>=3",
    "pydantic>=2",
]

[project.scripts]
ftbfs = "ftbfs.cli:main"

[project.entry-points."ftbfs.stages"]
# External plugins register here, e.g.:
# my_stage = "my_pkg.module:MyStage"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
